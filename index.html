<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyWelt3D</title>

    <!-- Favicon -->
    <link rel="icon" href="logo.jpg" type="image/jpeg" />

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">

    <style>
      :root {
        --warm-beige: #F6F0E7;
        --clay-brown: #4B362C;
        --leaf-green: #8BB57B;
        --lake-blue: #8DBFD6;
        --soft-cream: #FFF9F2;
        --rust-orange: #D8B68E;
      }

      body {
        margin: 0;
        font-family: 'Karla', sans-serif;
        background: var(--warm-beige) url('background.jpg') no-repeat center center fixed;
        background-size: cover;
        color: var(--clay-brown);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }

      #logo {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
        border: 3px solid var(--leaf-green);
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
      }

      h1 {
        font-family: 'Comfortaa', cursive;
        font-size: 2.5rem;
        margin: 0;
      }

      h2 {
        font-family: 'Nunito', sans-serif;
        font-weight: 600;
        color: var(--rust-orange);
        margin-bottom: 25px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 260px;
      }

      .link {
        background-color: var(--leaf-green);
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 12px;
        border-radius: 30px;
        transition: all 0.3s ease;
        font-family: 'Montserrat', sans-serif;
      }

      .link:hover {
        background-color: var(--lake-blue);
        transform: scale(1.03);
      }

      footer {
        font-family: 'Nunito', sans-serif;
        font-weight: 300;
        font-size: 0.9rem;
        margin-top: 30px;
        color: var(--clay-brown);
        opacity: 0.8;
      }

      footer a {
        color: var(--rust-orange);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <img id="logo" src="logo.jpg" alt="TinyWelt3D Logo" />
    <h1>@tinywelt3D</h1>
    <h2>Mini worlds brought to life.</h2>

    <div class="links">

      <a class="link" href="https://makerworld.com/en/@flavia" target="_blank"><i class="fas fa-cube"></i> MakerWorld</a>
      <a class="link" href="https://www.makeronline.com/en/user/personalInfo/a4428573-face-4e7e-be27-549a0a0f3812.html" target="_blank"><i class="fas fa-cubes"></i> MakerOnline</a>
      <a class="link" href="https://www.crealitycloud.com/user/8557138796" target="_blank"><i class="fas fa-cloud"></i> Creality Cloud</a>
      <a class="link" href="https://www.instagram.com/tinywelt3d/" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
      <a class="link" href="https://www.tiktok.com/@tinywelt3d?_t=ZN-90uN8SiCfCg&_r=1" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    </div>

    <footer>
      © 2025 TinyWelt3D 
    </footer>
  </body>
</html>
